[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
# SPA: -s hace fallback a index.html (React Router)
startCommand = "npx --yes serve@14 -s dist -l tcp://0.0.0.0:$PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
