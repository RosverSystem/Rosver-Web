[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# Web SPA (dist) + API Hono (misma origen). migrate+seed upsert en boot.
startCommand = "npx tsx server/src/migrate.ts && npx tsx server/src/seed.ts && npx tsx server/src/index.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
